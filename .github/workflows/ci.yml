name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # dist/ ist eingecheckt (siehe .gitignore) -- ein vergessener Build vor
      # dem Commit wuerde Konsumenten sonst stumm auf einer alten Fassung
      # haengen lassen.
      - name: dist/ auf dem Stand von src/?
        run: git diff --exit-code -- dist
